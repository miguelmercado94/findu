# FINDU — stack local
#   1) postgres       → localhost:5432  (findu / findu / findu)
#   2) localstack     → DynamoDB API http://localhost:4566
#   3) redis          → localhost:6379
#   4) findu-security → imagen desde ./SECURITY/findu-spring-security/Dockerfile
#
# Variables:
#   - FINDU-PROJECT/.env  → sustituye ${VAR} en este archivo (copiar desde .env.example en la raíz).
#   - SECURITY/findu-spring-security/.env → carga en el contenedor (env_file): JWT, logs, Dynamo, etc.
#   - Perfil Spring en Docker: define SPRING_PROFILES_ACTIVE en FINDU-PROJECT/.env (raíz); el bloque environment
#     del servicio findu-security lo aplica y sustituye el valor homónimo del env_file de la app.
#
# Perfil recomendado con este stack (Postgres + Redis + LocalStack): qa o pdn.
# Con perfil dev la app excluye autoconfig de Redis; el contenedor redis sigue disponible pero la app no lo usa.
#
# Uso: docker compose up -d --build
# Logs: docker logs -f findu-security

services:
  postgres:
    image: postgres:16-alpine
    container_name: findu-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findu}
      POSTGRES_DB: ${POSTGRES_DB:-findu}
    volumes:
      - findu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findu} -d ${POSTGRES_DB:-findu}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack:3.8
    container_name: findu-localstack
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: dynamodb
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${DEBUG:-0}
      HOSTNAME_EXTERNAL: localhost
      LS_LOG: ${LOCALSTACK_LOG:-warning}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  redis:
    image: redis:7-alpine
    container_name: findu-redis
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  findu-security:
    build:
      context: ./SECURITY/findu-spring-security
      dockerfile: Dockerfile
    image: findu-spring-security:${FINDU_SECURITY_TAG:-local}
    container_name: findu-security
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:8081"
    env_file:
      - ./SECURITY/findu-spring-security/.env
    environment:
      # Perfil: prioridad variable de entorno al arrancar compose (FINDU-PROJECT/.env) → default qa
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-qa}
      # Red Docker: sustituyen localhost del .env local de la app
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-findu}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-findu}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-findu}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      FINDU_AWS_DYNAMODB_ENDPOINT: http://localstack:4566
      FINDU_AWS_DYNAMODB_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Stack completo: activar Redis/Dynamo salvo que el .env raíz indique lo contrario
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-never}
      FINDU_REDIS_ENABLED: ${FINDU_REDIS_ENABLED:-true}
      FINDU_AWS_DYNAMODB_ENABLED: ${FINDU_AWS_DYNAMODB_ENABLED:-true}
      FINDU_AWS_DYNAMODB_CREATE_TABLE_IF_NOT_EXISTS: ${FINDU_AWS_DYNAMODB_CREATE_TABLE_IF_NOT_EXISTS:-true}
      MANAGEMENT_HEALTH_REDIS_ENABLED: ${MANAGEMENT_HEALTH_REDIS_ENABLED:-true}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/security-auth/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  findu-postgres-data:
