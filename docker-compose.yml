# LocalStack: AWS local (DynamoDB) + Redis (caché local, independiente de LocalStack).
# Uso: docker compose up -d
# DynamoDB: http://localhost:4566  |  Región típica: us-east-1
# Redis:    localhost:6379 (sin contraseña por defecto)
#
# Si el contenedor sale con código de error, prueba:
#   docker compose down -v
#   docker compose up -d
#   docker logs findu-localstack
#
# Ejemplo tabla DynamoDB:
#   aws dynamodb create-table --endpoint-url http://localhost:4566 --region us-east-1 \
#     --table-name findu-example --billing-mode PAY_PER_REQUEST \
#     --attribute-definitions AttributeName=id,AttributeType=S \
#     --key-schema AttributeName=id,KeyType=HASH

services:
  localstack:
    # Versión fija (evita cambios inesperados de :latest y fallos al arrancar)
    image: localstack/localstack:3.8
    container_name: findu-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=${DEBUG:-0}
      # Clientes en el host se conectan a localhost:4566
      - HOSTNAME_EXTERNAL=localhost
    # Sin volumen por defecto: en Windows a veces el volumen nombrado + datos viejos provocan crash al iniciar.
    # Para persistir datos, descomenta el bloque volumes de abajo y ejecuta: docker compose up -d
    # volumes:
    #   - findu-localstack-data:/var/lib/localstack

  redis:
    image: redis:7-alpine
    container_name: findu-redis
    ports:
      - "6379:6379"
    # Sin persistencia por defecto; para datos entre reinicios descomenta:
    # volumes:
    #   - findu-redis-data:/data
    # command: redis-server --appendonly yes

# volumes:
#   findu-localstack-data:
#   findu-redis-data:
