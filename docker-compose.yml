# FINDU — stack local (Docker Compose)
# =====================================================================
# Orden de arranque:
#   1. Red privada: findu-internal (solo acceso inter-contenedores)
#   2. Arquitectura: eureka-server → api-gateway (expuestos al host)
#   3. Bases de datos: postgres-security, postgres-oauth2 (red privada)
#   4. Seguridad: findu-spring-security, autorization-server-oauth2 (red privada, perfil dev)
#
# Frontends (Vite): se levantan localmente (no Docker)
#   - cliente:   npm run dev → http://localhost:3000
#   - proveedor: npm run dev → http://localhost:3001
#
# Uso:
#   docker compose up -d
#   Luego en terminales separadas:
#     cd FRONTEND/cliente   && npm run dev
#     cd FRONTEND/proveedor && npm run dev
# =====================================================================

services:

  # ─────────────────────────────────────────────────────────────────────
  # ARQUITECTURA (expuestos al host)
  # ─────────────────────────────────────────────────────────────────────

  eureka-server:
    image: mmercado94/findu-eureka-server:1.0.0
    container_name: findu-eureka-server
    networks:
      - findu-internal
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    image: mmercado94/findu-api-gateway:1.0.0
    container_name: findu-api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - findu-internal
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────
  # BASES DE DATOS (red privada, sin puertos expuestos al host)
  # ─────────────────────────────────────────────────────────────────────

  postgres-security:
    image: postgres:16-alpine
    container_name: findu-postgres-security
    networks:
      - findu-internal
    environment:
      POSTGRES_USER: findu
      POSTGRES_PASSWORD: findu
      POSTGRES_DB: findu
    volumes:
      - findu-pg-security-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findu -d findu"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-oauth2:
    image: postgres:16-alpine
    container_name: findu-postgres-oauth2
    networks:
      - findu-internal
    environment:
      POSTGRES_USER: findu_oauth2
      POSTGRES_PASSWORD: findu_oauth2_password
      POSTGRES_DB: findu_oauth2
    volumes:
      - findu-pg-oauth2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findu_oauth2 -d findu_oauth2"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────
  # SEGURIDAD (red privada, perfil dev, sin puertos expuestos al host)
  # ─────────────────────────────────────────────────────────────────────

  findu-spring-security:
    image: mmercado94/findu-spring-security:1.0.0
    container_name: findu-spring-security
    hostname: findu-spring-security
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-security:
        condition: service_healthy
    networks:
      - findu-internal
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-security:5432/findu
      SPRING_R2DBC_USERNAME: findu
      SPRING_R2DBC_PASSWORD: findu
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Eureka — forzar que se registre con el hostname DNS de Docker Compose
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: findu-spring-security
      # JWT — misma clave para generar y validar tokens
      JWT_SECRET: ZmluZHUtZGVmYXVsdC1zZWNyZXQta2V5LWF0LWxlYXN0LTI1Ni1iaXRzLWZvci1oczI1Ng==
      JWT_ACCESS_EXPIRATION_SECONDS: "3600"
      JWT_REFRESH_EXPIRATION_SECONDS: "604800"
      # Issuer URI — apunta al authorization-server dentro de la red Docker
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://autorization-server-oauth2:9595/authorization-server
      FINDU_REDIS_ENABLED: "false"
      FINDU_AWS_DYNAMODB_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/security-auth/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  autorization-server-oauth2:
    image: mmercado94/findu-autorization-server-oauth2:1.0.0
    container_name: findu-autorization-server-oauth2
    hostname: findu-autorization-server-oauth2
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres-oauth2:
        condition: service_healthy
      findu-spring-security:
        condition: service_healthy
    networks:
      - findu-internal
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-oauth2:5432/findu_oauth2
      SPRING_DATASOURCE_USERNAME: findu_oauth2
      SPRING_DATASOURCE_PASSWORD: findu_oauth2_password
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: findu-autorization-server-oauth2
      FINDU_SECURITY_API_BASE_URL: http://findu-spring-security:8081/security-auth
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9595/authorization-server/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

# ─────────────────────────────────────────────────────────────────────
# REDES Y VOLÚMENES
# ─────────────────────────────────────────────────────────────────────

networks:
  findu-internal:
    driver: bridge

volumes:
  findu-pg-security-data:
  findu-pg-oauth2-data:
