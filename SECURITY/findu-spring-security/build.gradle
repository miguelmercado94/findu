plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.findu'
version = '0.0.1-SNAPSHOT'

ext {
    set('springCloudVersion', "2024.0.0")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.data:spring-data-redis'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.5'

    // Jackson 2.x: JwtServiceImpl y jjwt-jackson usan com.fasterxml.jackson.*.
    // Spring Boot 4 también trae Jackson 3 (tools.jackson) vía starters; este BOM alinea Jackson 2 en el classpath.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.20.2')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JWT (JJWT 0.12.x API: parser().verifyWith(), parseSignedClaims, etc.)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    runtimeOnly 'org.postgresql:r2dbc-postgresql:1.0.7.RELEASE'

    implementation platform('software.amazon.awssdk:bom:2.29.51')
    implementation 'software.amazon.awssdk:dynamodb'

    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = '0.8.12'
}

/**
 * Exclusiones alineadas con SonarQube (DTOs, entidades, config, MapStruct) y capa de infraestructura
 * (R2DBC/DynamoDB/Redis/adaptadores) cubierta mejor por tests de integración o contratos.
 */
def jacocoExcludedFiles = [
        'com/findu/security/dto/**',
        'com/findu/security/infrastructure/entity/**',
        'com/findu/security/config/**',
        'com/findu/security/mapper/**',
        'com/findu/security/**/FinduSpringSecurityApplication.class',
        'com/findu/security/presentation/controller/CategoryController.class',
        'com/findu/security/presentation/controller/ProductController.class',
        'com/findu/security/infrastructure/adapter/persistence/**',
        'com/findu/security/infrastructure/adapter/cache/**',
        'com/findu/security/infrastructure/repository/impl/**',
        'com/findu/security/infrastructure/dynamodb/**',
        'com/findu/security/infrastructure/scheduler/**',
        'com/findu/security/infrastructure/repository/*.class',
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect { d ->
        fileTree(dir: d, excludes: jacocoExcludedFiles)
    }))
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    classDirectories.setFrom(files(sourceSets.main.output.classesDirs.collect { d ->
        fileTree(dir: d, excludes: jacocoExcludedFiles)
    }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
