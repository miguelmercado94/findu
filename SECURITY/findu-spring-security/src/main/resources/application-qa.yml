# QA / integración: sin recrear esquema por arranque (init desactivado salvo override explícito).
# Activación: --spring.profiles.active=qa

spring:
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD:}

findu:
  deployment: ${FINDU_DEPLOYMENT:qa}
  auth:
    reset-password-base-url: ${FINDU_AUTH_RESET_PASSWORD_BASE_URL:https://qa.findu.example/reset-password}
    recovery-token-expiry-minutes: ${FINDU_AUTH_RECOVERY_TOKEN_EXPIRY_MINUTES:60}
  aws:
    dynamodb:
      enabled: ${FINDU_AWS_DYNAMODB_ENABLED:true}
      endpoint: ${FINDU_AWS_DYNAMODB_ENDPOINT:}
      region: ${FINDU_AWS_DYNAMODB_REGION:us-east-1}
      revoked-tokens-table: ${FINDU_AWS_DYNAMODB_REVOKED_TOKENS_TABLE:findu_revoked_tokens}
      create-table-if-not-exists: ${FINDU_AWS_DYNAMODB_CREATE_TABLE_IF_NOT_EXISTS:false}
  redis:
    enabled: ${FINDU_REDIS_ENABLED:true}
    command-timeout-ms: ${FINDU_REDIS_COMMAND_TIMEOUT_MS:300}
    eviction-interval-ms: ${FINDU_REDIS_EVICTION_INTERVAL_MS:3600000}
    key-prefix: ${FINDU_REDIS_KEY_PREFIX:findu:revoked:}

management:
  health:
    redis:
      enabled: true
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.findu.security: INFO
    com.findu.security.config.security.authentication.filter: INFO
    com.findu.security.application.service.impl.UsuarioServiceImpl: INFO
    com.findu.security.application.usecase.impl.RequestPasswordRecoveryUseCaseImpl: INFO
    com.findu.security.application.usecase.impl.ResetPasswordUseCaseImpl: INFO
    com.findu.security.infrastructure.adapter.persistence: INFO
    com.findu.security.infrastructure.adapter.cache: INFO
    org.springframework.security: INFO
    org.springframework.r2dbc.core: WARN
    org.springframework.data.r2dbc: WARN
    io.r2dbc: WARN
