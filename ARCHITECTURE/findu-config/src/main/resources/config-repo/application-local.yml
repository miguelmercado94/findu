eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: findu
    password: findu

findu:
  aws:
    dynamodb:
      endpoint: http://localstack:4566
      region: us-east-1
    s3:
      endpoint: http://localstack:4566
      region: us-east-1
