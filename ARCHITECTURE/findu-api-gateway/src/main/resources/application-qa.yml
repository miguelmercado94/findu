# QA / Railway: enrutamiento por DNS interno (*.railway.internal), sin Eureka ni lb://.
# Activación: --spring.profiles.active=qa

server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      discovery:
        locator:
          enabled: false
      routes:
        - id: security-auth-route
          uri: ${SECURITY_SERVICE_URI:http://findu-spring-security.railway.internal:8081}
          predicates:
            - Path=/security-auth/**
        - id: authorization-server-route
          uri: ${OAUTH2_SERVICE_URI:http://autorization-server-oauth2.railway.internal:9595}
          predicates:
            - Path=/authorization-server/**
        - id: findu-core-route
          uri: ${CORE_SERVICE_URI:http://findu-core.railway.internal:8082}
          predicates:
            - Path=/findu-core/**
        - id: findu-transaction-route
          uri: ${TRANSACTION_SERVICE_URI:http://findu-transaction.railway.internal:8084}
          predicates:
            - Path=/findu-transaction/**, /internal/**
        - id: findu-help-route
          uri: ${HELP_SERVICE_URI:http://findu-help-v2.railway.internal:8085}
          predicates:
            - Path=/findu-help-v2/**
        - id: notification-dispatcher-route
          uri: ${DISPATCHER_SERVICE_URI:http://findu-notification-dispatcher.railway.internal:9000}
          predicates:
            - Path=/ws/events/**, /notification-dispatcher/**
        - id: findu-validacion-route
          uri: ${VALIDACION_SERVICE_URI:http://findu-validacion.railway.internal:8088}
          predicates:
            - Path=/findu-validacion/**

findu:
  services:
    validacion-url: ${FINDU_VALIDACION_URL:http://findu-validacion.railway.internal:8088/findu-validacion}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

