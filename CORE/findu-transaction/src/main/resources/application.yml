server:
  port: 8086

spring:
  application:
    name: findu-transaction
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://findu-eureka-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:findu-transaction}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.findu.transaction: ${LOG_LEVEL_FINDU_TRANSACTION:DEBUG}

findu:
  settlement:
    mock:
      enabled: false
    cron: "${FINDU_SETTLEMENT_CRON:0 0 6 * * TUE}"
    zone: America/Bogota
  internal:
    service-key: ${FINDU_INTERNAL_SERVICE_KEY:}
