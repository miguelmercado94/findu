# Perfil DEV: PostgreSQL en Docker / servidor
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/findu_transaction}
    username: ${SPRING_DATASOURCE_USERNAME:findu_transaction}
    password: ${SPRING_DATASOURCE_PASSWORD:findu_transaction}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/postgres/schema.sql

logging:
  level:
    root: INFO
    com.findu.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
