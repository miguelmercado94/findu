server:
  port: 9000

spring:
  application:
    name: notification-dispatcher
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: dev

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:findu}
    password: ${RABBITMQ_PASSWORD:findu}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

findu:
  jwt:
    secret: ${JWT_SECRET:secret-key-at-least-32-bytes-long-for-findu-security-environment!}
  websocket:
    endpoint: /ws/events
    ping-interval-seconds: 30
  rabbitmq:
    exchanges:
      events: findu.events.exchange
      fallback: findu.notifications.fallback.exchange
    queues:
      dispatcher: findu.dispatcher.events.queue
      fallback: findu.notifications.fallback.queue
    routing-keys:
      event: findu.event.#
      fallback: findu.fallback.notification
    # Ruta transaccional hacia el findu-notification-processor.
    # Los defaults coinciden con el contrato del processor; no requieren env vars nuevas en Railway (perfil qa).
    # Dependencia de orden (QA): el dispatcher declara el exchange topic findu.notifications pero NO las
    # colas/bindings del processor (notification.sms, notification.correo, etc.). El processor es un
    # consumidor de larga vida que declara sus bindings al arrancar; una vez arriba, cualquier publish del
    # dispatcher se enruta a la cola del canal. Si el dispatcher publicara ANTES de que el processor haya
    # declarado el binding, ese mensaje se descartaría en el topic exchange (sin cola suscrita). En QA el
    # processor debe estar desplegado y arrancado para no perder notificaciones transaccionales.
    notification:
      exchange: ${FINDU_NOTIFICATION_EXCHANGE:findu.notifications}
      routing-keys:
        sms: ${FINDU_NOTIFICATION_RK_SMS:notification.sms}
        email: ${FINDU_NOTIFICATION_RK_EMAIL:notification.email}
        push: ${FINDU_NOTIFICATION_RK_PUSH:notification.push}
        whatsapp: ${FINDU_NOTIFICATION_RK_WHATSAPP:notification.whatsapp}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
