# Dev: RabbitMQ en Docker + DynamoDB en LocalStack
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:findu}
    password: ${RABBITMQ_PASSWORD:findu}

findu:
  notification:
    dynamodb:
      endpoint: ${DYNAMODB_ENDPOINT:http://localstack:4566}
      region: us-east-1
      table-name: findu_notifications

logging:
  level:
    com.findu.notification: DEBUG
