# QA / integración (Railway). Activación: --spring.profiles.active=qa
# Railway inyecta PORT; conexiones vía variables de entorno (sin hosts hardcodeados).

server:
  port: ${PORT:9000}

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD:}

findu:
  jwt:
    secret: ${JWT_SECRET}
  rabbitmq:
    # Ruta transaccional hacia el findu-notification-processor.
    # Defaults correctos: no requieren variables de entorno nuevas en Railway (perfil qa).
    notification:
      exchange: ${FINDU_NOTIFICATION_EXCHANGE:findu.notifications}
      routing-keys:
        sms: ${FINDU_NOTIFICATION_RK_SMS:notification.sms}
        email: ${FINDU_NOTIFICATION_RK_EMAIL:notification.email}
        push: ${FINDU_NOTIFICATION_RK_PUSH:notification.push}
        whatsapp: ${FINDU_NOTIFICATION_RK_WHATSAPP:notification.whatsapp}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
