# QA / integración (Railway). Activación: --spring.profiles.active=qa
# Railway inyecta PORT; conexiones vía variables de entorno (sin hosts hardcodeados).

server:
  port: ${PORT:9000}

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD:}

findu:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
