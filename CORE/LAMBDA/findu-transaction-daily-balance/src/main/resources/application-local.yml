server:
  port: 8087

spring:
  datasource:
    url: jdbc:h2:mem:findu_transaction_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

findu:
  daily-balance:
    cron: "0 0 22 * * *"
    timezone: "America/Bogota"
