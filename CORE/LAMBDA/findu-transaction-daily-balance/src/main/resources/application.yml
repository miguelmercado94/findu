server:
  port: 8087

spring:
  application:
    name: findu-transaction-daily-balance
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/findu_transaction_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

findu:
  daily-balance:
    cron: "${FINDU_DAILY_BALANCE_CRON:0 0 22 * * *}"
    timezone: "${FINDU_TIMEZONE:America/Bogota}"

logging:
  level:
    root: INFO
    com.findu: DEBUG
