# =====================================================================
# FINDU Core — Configuración base (común a todos los perfiles)
# Perfil activo: local | dev | test | pdn
# =====================================================================

server:
  port: 8082
  servlet:
    context-path: /findu-core

spring:
  application:
    name: findu-core
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.findu.core: ${LOG_LEVEL_FINDU_CORE:INFO}

findu:
  notification:
    enabled: ${FINDU_NOTIFICATION_ENABLED:false}
    lambda-url: ${FINDU_NOTIFICATION_LAMBDA_URL:http://localhost:9000}
