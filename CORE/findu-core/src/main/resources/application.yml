# =====================================================================
# FINDU Core — Configuración base (común a todos los perfiles)
# Perfil activo: local | dev | test | pdn
# =====================================================================

server:
  port: 8082
  servlet:
    context-path: /findu-core

spring:
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  application:
    name: findu-core
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.findu.core: ${LOG_LEVEL_FINDU_CORE:INFO}

findu:
  storage:
    # Tamano maximo de la foto de perfil (bytes); multipart permite 6MB para que el 413 lo emita el use case
    foto-perfil-max-bytes: ${FINDU_STORAGE_FOTO_PERFIL_MAX_BYTES:5242880}
    # Migrar fotos legacy base64/data-URI a perfil/ al leerlas (false = tratarlas como ausentes)
    migrate-legacy: ${FINDU_STORAGE_MIGRATE_LEGACY:false}
  notification:
    enabled: ${FINDU_NOTIFICATION_ENABLED:false}
    lambda-url: ${FINDU_NOTIFICATION_LAMBDA_URL:http://localhost:9000}
  aws:
    s3:
      bucket: ${FINDU_AWS_S3_BUCKET:findu-media-assets-local}
      region: ${FINDU_AWS_S3_REGION:us-east-1}
      endpoint: ${FINDU_AWS_S3_ENDPOINT:}
      access-key: ${FINDU_AWS_S3_ACCESS_KEY:}
      secret-key: ${FINDU_AWS_S3_SECRET_KEY:}
      path-style: ${FINDU_AWS_S3_PATH_STYLE:false}
      create-bucket-if-missing: ${FINDU_AWS_S3_CREATE_BUCKET_IF_MISSING:false}
