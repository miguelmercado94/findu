# =====================================================================
# Perfil LOCAL: H2 en memoria, sin dependencias externas.
# Ideal para desarrollo rápido sin levantar PostgreSQL ni Docker.
# Consola H2: http://localhost:8082/findu-core/h2-console
# =====================================================================

spring:
  datasource:
    url: jdbc:h2:mem:findu_core;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql

logging:
  level:
    root: INFO
    com.findu.core: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
