# =====================================================================
# Perfil TEST: PostgreSQL dedicado para pruebas de integración.
# Schema gestionado por Hibernate (create-drop) + data de prueba.
# Usado en pipelines CI/CD o testing local con BD separada.
# =====================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/findu_core_test}
    username: ${SPRING_DATASOURCE_USERNAME:findu_core}
    password: ${SPRING_DATASOURCE_PASSWORD:findu_core}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      data-locations: classpath:db/postgres/data.sql

logging:
  level:
    root: WARN
    com.findu.core: INFO
    org.hibernate.SQL: WARN
