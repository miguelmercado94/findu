# =====================================================================
# Perfil DEV: PostgreSQL en Docker.
# Schema y datos controlados por SQL scripts (igual que H2 local).
# =====================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/findu_core}
    username: ${SPRING_DATASOURCE_USERNAME:findu_core}
    password: ${SPRING_DATASOURCE_PASSWORD:findu_core}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/postgres/schema.sql
      data-locations: classpath:db/postgres/data.sql

  redis:
    host: ${SPRING_DATA_REDIS_HOST:localhost}
    port: ${SPRING_DATA_REDIS_PORT:6379}
    timeout: ${SPRING_DATA_REDIS_TIMEOUT:300ms}

findu:
  cache:
    enabled: ${FINDU_CACHE_ENABLED:true}

logging:
  level:
    root: INFO
    com.findu.core: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
