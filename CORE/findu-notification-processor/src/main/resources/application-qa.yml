# QA / integración: Railway (PORT inyectado, RabbitMQ + Redis + AWS real SES/SNS/DynamoDB).
# Activación: --spring.profiles.active=qa

server:
  port: ${PORT:8083}

spring:
  webflux:
    base-path: /findu-notification-processor
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

findu:
  services:
    security-url: ${FINDU_SECURITY_URL:http://findu-spring-security.railway.internal:8081/security-auth}
  notification:
    templates:
      table: ${DYNAMODB_TEMPLATES_TABLE:notification_templates}
    dynamodb:
      device-tokens-table: ${DYNAMODB_DEVICE_TOKENS_TABLE:findu_device_tokens}
    firebase:
      # Railway: credencial Firebase por secret inline (JSON) o secret file (ruta). Proyecto achambear-5fae3.
      credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    aws:
      region: ${AWS_REGION:us-east-1}
      ses:
        from-email: ${SES_FROM_EMAIL}
      sns:
        enabled: ${SNS_ENABLED:false}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
