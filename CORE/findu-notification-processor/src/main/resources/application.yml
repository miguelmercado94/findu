server:
  port: 8083

spring:
  application:
    name: findu-notification-processor
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  webflux:
    base-path: /findu-notification-processor
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

findu:
  internal:
    service-key: ${FINDU_INTERNAL_SERVICE_KEY:findu-internal-saga-secret-key-2026}
  services:
    security-url: ${FINDU_SECURITY_URL:http://localhost:8081/security-auth}
  notification:
    exchange: findu.notifications
    queue:
      push: findu.notifications.push
      email: findu.notifications.correo
      sms: findu.notifications.celular
      whatsapp: findu.notifications.whatsapp
      alerts: findu.notifications.alerts
    templates:
      table: ${DYNAMODB_TEMPLATES_TABLE:notification_templates}
    dynamodb:
      device-tokens-table: ${DYNAMODB_DEVICE_TOKENS_TABLE:findu_device_tokens}
    firebase:
      credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    aws:
      region: ${AWS_REGION:us-east-1}
      dynamodb:
        endpoint: ${DYNAMODB_ENDPOINT:}
      ses:
        endpoint: ${SES_ENDPOINT:}
        from-email: ${SES_FROM_EMAIL:no-reply@findu.co}
      sns:
        endpoint: ${SNS_ENDPOINT:}
        enabled: ${SNS_ENABLED:false}
    whatsapp:
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      enabled: ${WHATSAPP_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.findu.notification: ${LOG_LEVEL_FINDU_NOTIFICATION:DEBUG}
