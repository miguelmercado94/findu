server:
  port: 8085

spring:
  application:
    name: findu-help-v2
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/findu_help_v2_db}
      auto-index-creation: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

findu:
  help:
    aws:
      s3:
        bucket: ${S3_BUCKET:findu-help-bucket}
        region: ${AWS_REGION:us-east-1}
        endpoint: ${S3_ENDPOINT:}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}

  notification:
    dispatcher:
      url: ${NOTIFICATION_DISPATCHER_URL:http://localhost:9000}
      connect-timeout-ms: 5000
      read-timeout-ms: 5000
    processor:
      url: ${NOTIFICATION_PROCESSOR_URL:http://localhost:8083}
      connect-timeout-ms: 5000
      read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.findu.help.v2: ${LOG_LEVEL_FINDU_HELP:DEBUG}
