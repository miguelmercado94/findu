# QA / integración: Railway o Docker Compose
server:
  port: ${PORT:8088}

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:findu}
    password: ${RABBITMQ_PASSWORD:findu}

logging:
  level:
    root: INFO
    com.findu.validacion: INFO
